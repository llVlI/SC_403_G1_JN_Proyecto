<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"/>

<body>

<header th:replace="~{general/fragmentos :: header}"/>

<div th:replace="~{general/fragmentos :: mostrarToast}"></div>

<main class="container py-5">

    <h2 class="fw-bold mb-4">
        <i class="fas fa-clipboard-list me-2"></i>
        Mis Pedidos
    </h2>

    <div th:if="${#lists.isEmpty(pedidos)}"
         class="alert alert-info text-center">

        <h5 class="fw-bold">No tienes pedidos registrados</h5>

        <p class="mb-3">
            Cuando confirmes una compra aparecerá aquí.
        </p>

        <a th:href="@{/catalogo}"
           class="btn btn-primary">
            Ir al catálogo
        </a>

    </div>

    <div th:if="${!#lists.isEmpty(pedidos)}">

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Pedido</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="pedido : ${pedidos}">

                    <td th:text="|#${pedido.idPedido}|">
                        #1
                    </td>

                    <td th:text="${#temporals.format(
                            pedido.fecha,
                            'dd/MM/yyyy HH:mm')}">
                        20/08/2026
                    </td>

                    <td th:text="|₡${pedido.total}|">
                        ₡0
                    </td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:if="${pedido.estadoPedido.nombre == 'Pendiente'}"
                              th:text="${pedido.estadoPedido.nombre}">
                            Pendiente
                        </span>

                        <span class="badge bg-primary"
                              th:if="${pedido.estadoPedido.nombre == 'En proceso'}"
                              th:text="${pedido.estadoPedido.nombre}">
                            En proceso
                        </span>

                        <span class="badge bg-info text-dark"
                              th:if="${pedido.estadoPedido.nombre == 'Listo para entrega'}"
                              th:text="${pedido.estadoPedido.nombre}">
                            Listo para entrega
                        </span>

                        <span class="badge bg-success"
                              th:if="${pedido.estadoPedido.nombre == 'Entregado'}"
                              th:text="${pedido.estadoPedido.nombre}">
                            Entregado
                        </span>

                        <span class="badge bg-danger"
                              th:if="${pedido.estadoPedido.nombre == 'Cancelado'}"
                              th:text="${pedido.estadoPedido.nombre}">
                            Cancelado
                        </span>

                    </td>

                    <td>

                        <form th:if="${pedido.estadoPedido.nombre == 'Pendiente'}"
                              th:action="@{/pedidos/{id}/cancelar(id=${pedido.idPedido})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">

                                <i class="fas fa-times me-1"></i>
                                Cancelar

                            </button>

                        </form>

                        <span th:if="${pedido.estadoPedido.nombre != 'Pendiente'}"
                              class="text-muted">
                            -
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"/>

</body>
</html>
