spring.application.name=repuestos-cr

server.port=80

logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:mysql://localhost:3306/autopartes_cr
spring.datasource.username=autopartes_user
spring.datasource.password=autopartes123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Tamano maximo de archivos subidos (imagenes de repuestos via Firebase Storage)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Firebase Storage (imagenes de repuestos - HU tecnologia no vista en clase)
# NUNCA se hardcodea la ruta de credenciales aqui. Cada quien la define en
# su propio application-local.properties (que NO se sube a git) o mediante
# la variable de entorno FIREBASE_CREDENTIALS_PATH.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.storage.bucket=repuestos-cr.firebasestorage.app
