<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<section class="container mt-5">

    <div class="mb-4">
        <h2 class="fw-bold mb-1"
            th:text="${repuesto.idRepuesto == null ? 'Nuevo Repuesto' : 'Editar Repuesto'}">
            Nuevo Repuesto
        </h2>
        <p class="text-muted mb-0">Pantalla 9 - Formulario de repuesto</p>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-warning text-dark fw-bold">
            <i class="fas fa-box me-1"></i> Datos del repuesto
        </div>

        <div class="card-body">

            <form th:action="@{/repuestos/guardar}"
                  method="post"
                  th:object="${repuesto}">

                <input type="hidden" th:field="*{idRepuesto}">

                <!-- Errores generales -->
                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">

                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}">
                        Error
                    </div>

                </div>

                <div class="row">

                    <!-- Nombre -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Nombre</label>

                        <input type="text"
                               th:field="*{nombre}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                               placeholder="Ejemplo: Pastillas de freno"
                               maxlength="100"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}">
                            Error en nombre
                        </div>

                    </div>

                    <!-- Código -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Código</label>

                        <input type="text"
                               th:field="*{codigo}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'"
                               placeholder="Ejemplo: REP-001"
                               maxlength="50"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('codigo')}"
                             th:errors="*{codigo}">
                            Error en código
                        </div>

                    </div>

                    <!-- Descripción -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">Descripción</label>

                        <textarea th:field="*{descripcion}"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                  rows="3"
                                  maxlength="255"
                                  placeholder="Descripción del repuesto"></textarea>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('descripcion')}"
                             th:errors="*{descripcion}">
                            Error en descripción
                        </div>

                    </div>

                    <!-- Precio -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">Precio</label>

                        <input type="number"
                               th:field="*{precio}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"
                               min="0"
                               step="0.01"
                               placeholder="25000"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('precio')}"
                             th:errors="*{precio}">
                            Error en precio
                        </div>

                    </div>

                    <!-- Stock -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">Stock</label>

                        <input type="number"
                               th:field="*{stock}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"
                               min="0"
                               placeholder="10"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('stock')}"
                             th:errors="*{stock}">
                            Error en stock
                        </div>

                    </div>

                    <!-- Marca -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">Marca</label>

                        <select name="idMarca"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione una marca
                            </option>

                            <option th:each="marca : ${marcas}"
                                    th:value="${marca.idMarca}"
                                    th:text="${marca.nombre}"
                                    th:selected="${repuesto.marca != null
                                    and repuesto.marca.idMarca == marca.idMarca}">
                                Toyota
                            </option>

                        </select>

                    </div>

                    <!-- Categoría -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">Categoría</label>

                        <select name="idCategoria"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione una categoría
                            </option>

                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.idCategoria}"
                                    th:text="${categoria.nombre}"
                                    th:selected="${repuesto.categoria != null
                                    and repuesto.categoria.idCategoria == categoria.idCategoria}">
                                Frenos
                            </option>

                        </select>

                    </div>

                </div>

                <div class="d-flex justify-content-between mt-4">

                    <a th:href="@{/repuestos}"
                       class="btn btn-secondary">

                        <i class="fas fa-arrow-left me-1"></i>
                        Volver

                    </a>

                    <button type="submit"
                            class="btn btn-warning fw-semibold">

                        <i class="fas fa-save me-1"></i>
                        Guardar Repuesto

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
